spring:
  application:
    name: logistica
  kafka:
    bootstrap-servers: 'localhost:29092'
    consumer:
      group-id: icompras-logistica
      auto-offset-reset: earliest

icompras:
  config:
    kafka:
      topics:
        pedidos-faturados: 'icompras.pedidos-faturados'
        pedidos-enviados: 'icompras.pedidos-enviados'

server:
  port: 8084

logging:
  level:
    # Mude para INFO ou comente com '#' para voltar a ver os logs
    org.apache.kafka: WARN
    org.hibernate: WARN
    org.hibernate.dialect.Dialect: WARN